<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf0f2">
<title>Rebuild &amp; Build: your back-safe training plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f2;--paper:#fff;--paper2:#f6f8f9;--ink:#16212b;--ink2:#4c5a66;--ink3:#76838e;--rule:#d3dadf;--rule2:#e4e9ec;
  --fig:#23303b;--fig-far:#9aa6b0;--glow:#e24e6e;--eq:#7d8a95;--eq-dark:#46525c;--eq-soft:#dde3e7;--pad:#5f6c77;--ball:#1f5fbf;--band:#2e9e5b;
  --green:#2e9e5b;--green-bg:#e3f3e9;--amber:#a86f00;--amber-dot:#f2b705;--amber-bg:#fdf2d6;--red:#c81f35;--red-bg:#fbe3e6;
  --focus:#1f5fbf;--accent:#1f5fbf;--plate:#2e9e5b;--plate-ink:#fff;
  --r-sheet:20px;--r-card:14px;--r-in:9px;
  --disp:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Barlow","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c;--paper:#18212a;--paper2:#1d2731;--ink:#e8edf0;--ink2:#aab6bf;--ink3:#7e8b96;--rule:#2b3743;--rule2:#222c36;
  --fig:#e1e8ed;--fig-far:#5f6b76;--eq:#7c8994;--eq-dark:#a7b2bb;--eq-soft:#2a3540;--pad:#8a97a1;--glow:#ff5f80;
  --green:#4cc27d;--green-bg:#17301f;--amber:#f2b705;--amber-bg:#33290c;--red:#ff5a6e;--red-bg:#3a1a20;--focus:#6aa2ff;--accent:#6aa2ff;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10161c;--paper:#18212a;--paper2:#1d2731;--ink:#e8edf0;--ink2:#aab6bf;--ink3:#7e8b96;--rule:#2b3743;--rule2:#222c36;
  --fig:#e1e8ed;--fig-far:#5f6b76;--eq:#7c8994;--eq-dark:#a7b2bb;--eq-soft:#2a3540;--pad:#8a97a1;--glow:#ff5f80;
  --green:#4cc27d;--green-bg:#17301f;--amber:#f2b705;--amber-bg:#33290c;--red:#ff5a6e;--red-bg:#3a1a20;--focus:#6aa2ff;--accent:#6aa2ff;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--disp);letter-spacing:.005em;margin:0;line-height:1.08}
h1{font-size:clamp(2.05rem,7vw,2.8rem);font-weight:700}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.2rem;font-weight:600}
p{margin:0 0 .6em}
.muted{color:var(--ink2)}.small{font-size:.875rem}.tiny{font-size:.8rem;color:var(--ink3)}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--rule2)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--disp);font-weight:800;font-size:1.3rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-mark{width:24px;height:24px;flex:none}
.sync{font-size:.78rem;color:var(--ink3);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.sync[data-s="synced"]::before{background:var(--green)}.sync[data-s="saving"]::before{background:var(--amber-dot)}.sync[data-s="error"]::before{background:var(--red)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}
.tabs button{flex:1;max-width:140px;border:0;background:none;padding:6px 2px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--ink3)}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--paper2)}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}
@media (min-width:900px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);bottom:auto;border:0;border-bottom:1px solid var(--rule2);background:var(--bg);padding:8px 16px;justify-content:center;gap:6px;z-index:29}
  .tabs button{flex:none;max-width:none;flex-direction:row;gap:8px;font-size:.95rem;padding:8px 14px}
  .tabs button svg{width:19px;height:19px}
}

main{max-width:1080px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){main{padding-bottom:80px}}
.col{max-width:760px;margin:0 auto}

/* generic blocks */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-card);padding:16px}
.stack>*+*{margin-top:14px}
.sec{margin-top:28px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-weight:600}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--rule2);font-size:.84rem;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.star{border-color:var(--ink3);color:var(--ink)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.caret{width:18px;height:18px;flex:none;transition:transform .2s;stroke:var(--ink3);fill:none;stroke-width:2}
details[open]>summary .caret{transform:rotate(90deg)}

/* plate badge */
.plate{--pc:var(--plate);--pi:var(--plate-ink);width:46px;height:46px;border-radius:50%;flex:none;background:var(--pc);color:var(--pi);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:1.05rem;position:relative;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--pc) 72%,#000 28%),0 0 0 1px rgba(0,0,0,.08)}
.plate::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--pc) 70%,#000 30%);opacity:.55}
.plate span{position:relative}
.plate.sm{width:30px;height:30px;font-size:.8rem;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc) 72%,#000 28%),0 0 0 1px rgba(0,0,0,.08)}
.plate.sm::before{inset:5px;border-width:1px}
/* today header */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datebar .d{font-family:var(--disp);font-weight:600;font-size:1.15rem;flex:1;text-align:center}
.datebar .iconbtn{width:38px;height:38px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .phase{font-size:.95rem;color:var(--ink2);margin-bottom:4px}
.hero h1{margin-bottom:4px}
.banner{border-radius:12px;padding:10px 14px;background:var(--paper2);border:1px solid var(--rule);font-size:.93rem}
.banner.deload{border-left:5px solid var(--accent)}
.banner.test{border-left:5px solid var(--amber-dot)}

/* readiness */
.ready h3{margin-bottom:10px}
.painrow{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.painrow button{height:42px;border-radius:9px;border:1px solid var(--rule);background:var(--paper2);font-family:var(--disp);font-weight:700;font-size:1.05rem;padding:0}
.painrow button[data-z="g"]{border-bottom:3px solid var(--green)}
.painrow button[data-z="a"]{border-bottom:3px solid var(--amber-dot)}
.painrow button[data-z="r"]{border-bottom:3px solid var(--red)}
.painrow button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.painscale{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink3);margin-top:4px}
.light{margin-top:12px;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start}
.light .dot{width:14px;height:14px;border-radius:50%;margin-top:4px}
.light.green{background:var(--green-bg)}.light.green .dot{background:var(--green)}
.light.amber{background:var(--amber-bg)}.light.amber .dot{background:var(--amber-dot)}
.light.red{background:var(--red-bg)}.light.red .dot{background:var(--red)}
.light b{font-family:var(--disp);font-size:1.08rem;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper2);font-size:.9rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* blocks: warm-up, cool-down */
.blk>summary{display:flex;align-items:center;gap:10px;padding:14px 16px}
.blk>summary h3{flex:1}
.blk{padding:0}
.blk .blk-in{padding:0 16px 14px}
.mini{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule2)}
.mini:first-child{border-top:0}
.mini .figbox{width:76px;padding:2px}
.mini .nm{font-weight:600;line-height:1.25}
.mini .rx{font-size:.86rem;color:var(--ink2)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--rule);background:var(--paper);display:grid;place-items:center;flex:none;padding:0}
.check svg{width:20px;height:20px;stroke:transparent;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.check[aria-pressed="true"] svg{stroke:#fff}

/* exercise cards */
.ex{padding:0;overflow:hidden}
.ex-top{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:14px 14px 10px}
.figbox{background:var(--paper2);border-radius:10px;border:1px solid var(--rule2);padding:4px;cursor:zoom-in;align-self:start}
.ex-nm{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.ex-nm h3{font-size:1.22rem;cursor:pointer}
.grp{font-family:var(--disp);font-weight:700;font-size:.85rem;background:var(--ink);color:var(--paper);border-radius:7px;padding:1px 7px;flex:none}
.ex .chips{margin:6px 0 4px}
.ex .note{font-size:.9rem;color:var(--ink2);margin:4px 0 0}
.ex .warnline{font-size:.88rem;margin-top:6px;padding:6px 10px;border-radius:8px}
.warnline.amber{background:var(--amber-bg)}.warnline.red{background:var(--red-bg)}
.stepline{font-size:.9rem;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--paper2);border-left:4px solid var(--plate)}
.sets{padding:4px 14px 12px}
.setrow{display:grid;grid-template-columns:50px 1fr 1fr 44px;gap:8px;align-items:center;padding:4px 0}
.setrow.one{grid-template-columns:50px 1fr 44px}
.setrow .sn{font-family:var(--disp);font-weight:600;color:var(--ink3);font-size:.95rem}
.setrow .check{width:44px;height:44px}
.fld{position:relative}
.fld input{width:100%;height:44px;border-radius:var(--r-in);border:1px solid var(--rule);background:var(--paper2);padding:0 34px 0 12px;font-family:var(--disp);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--ink3);font-weight:500}
.fld span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.78rem;color:var(--ink3);pointer-events:none}
.setrow.done .fld input{border-color:color-mix(in srgb,var(--green) 55%,var(--rule));background:color-mix(in srgb,var(--green-bg) 70%,var(--paper2))}
.ticks{display:flex;flex-wrap:wrap;gap:8px}
.last{font-size:.84rem;color:var(--ink3);padding:2px 0 0}
.finish textarea{width:100%;min-height:74px;border-radius:12px;border:1px solid var(--rule);background:var(--paper2);padding:10px 12px;resize:vertical}
.done-mark{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--green)}
.done-mark svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4}

/* timer */
.timer{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:45;max-width:560px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(10,20,30,.28)}
.timer .t{font-family:var(--disp);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px}
.timer .lbl{flex:1;font-size:.85rem;line-height:1.25;opacity:.85;overflow:hidden}
.timer button{min-height:40px;min-width:46px;border-radius:10px;border:1px solid color-mix(in srgb,var(--paper) 30%,transparent);background:transparent;color:var(--paper);font-weight:600;font-size:.9rem}
.timer .bar{position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--paper) 18%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--amber-dot);width:0}
.timer.over{background:var(--green)}
@media (min-width:900px){.timer{bottom:20px}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:60}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--paper);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(10,20,30,.25)}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:88vh;border-radius:var(--r-sheet);padding:18px 22px 24px}}
.sheet-h{display:flex;align-items:center;gap:10px;position:sticky;top:-10px;background:var(--paper);padding:8px 0 10px;z-index:2}
.sheet-h h2{flex:1}
.grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:2px auto 6px}
@media (min-width:760px){.grab{display:none}}
.bigfig{background:var(--paper2);border:1px solid var(--rule2);border-radius:14px;padding:8px;max-width:420px;margin:0 auto 14px}
.cues{margin:8px 0 0;padding-left:1.2em}
.cues li{margin:0 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin-top:12px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.callout{border-radius:12px;padding:10px 14px;background:var(--paper2);border:1px solid var(--rule2);margin-top:12px;font-size:.93rem}
.callout.warn{background:var(--amber-bg);border-color:transparent}
.callout.spine{border-left:4px solid var(--accent)}

/* plan */
.phasepick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.phasepick::-webkit-scrollbar{display:none}
.phasepick button{display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);padding:4px 14px 4px 4px;white-space:nowrap;font-weight:600;min-height:40px}
.phasepick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.phasehead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:8px 0 14px}
.rules{margin:0;padding-left:1.15em}
.rules li{margin:0 0 5px}
.week{display:grid;gap:0}
.wrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--rule2)}
.wrow:first-child{border-top:0}
.wrow .wd{font-family:var(--disp);font-weight:700;color:var(--ink2)}
.wrow.rest .t{color:var(--ink3)}
.sess>summary{display:flex;align-items:center;gap:12px;padding:14px 16px}
.sess>summary .t{flex:1}
.sess>summary h3{font-size:1.15rem}
.sess .rows{padding:0 16px 12px}
.prow{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule2);cursor:pointer}
.prow .nm{font-weight:600;line-height:1.25}
.prow .rx{font-size:.88rem;color:var(--ink2)}
.ranges{display:flex;flex-wrap:wrap;gap:6px}
.ranges .chip{font-size:.8rem}
.daylist .wrow{grid-template-columns:104px 1fr auto}

/* roadmap bar */
.sleeve{position:relative;padding:12px}
.cyc.now{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.sleeve svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:.88rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-top:1px solid var(--rule2);vertical-align:top}
.tbl th{font-weight:600;color:var(--ink3);font-size:.82rem;border-top:0}
.tblwrap{overflow-x:auto}

/* back care */
.carehero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.carehero{grid-template-columns:110px 1fr}}
.lights{display:grid;gap:10px}
@media (min-width:760px){.lights{grid-template-columns:repeat(3,1fr)}}
.lights .light{margin:0;grid-template-columns:14px 1fr}
.ladders{display:grid;gap:14px}
@media (min-width:760px){.ladders{grid-template-columns:1fr 1fr}}
.ladder ol{list-style:none;margin:10px 0 12px;padding:0;counter-reset:st}
.ladder li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--rule2);align-items:start}
.ladder li::before{content:counter(st);font-family:var(--disp);font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);border:1px solid var(--rule);color:var(--ink2)}
.ladder li.cur::before{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ladder li.cur{font-weight:600}
.ladder li.past{color:var(--ink3)}
.ladder li b{display:block;font-family:var(--disp);font-size:1.02rem}
.gate li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:6px 0}
.gate ul{list-style:none;margin:0;padding:0}
.flag{border-radius:14px;padding:14px 16px;background:var(--red-bg);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}
.faq details{border-top:1px solid var(--rule2)}
.faq details:first-child{border-top:0}
.faq summary{display:flex;gap:10px;align-items:center;padding:12px 0;font-weight:600}
.faq summary span{flex:1}
.faq p{color:var(--ink2);margin:0 0 12px}

/* library */
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);padding:0 14px;font-size:1rem}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border-radius:999px;border:1px solid var(--rule);background:var(--paper);padding:6px 14px;white-space:nowrap;font-weight:600;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-card);padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile .fig-t{background:var(--paper2);border-radius:9px;padding:3px}
.tile b{font-size:.95rem;line-height:1.2}
.tile small{color:var(--ink3);font-size:.8rem;line-height:1.3}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-card);padding:12px}
.stat .v{font-family:var(--disp);font-weight:700;font-size:2rem;line-height:1}
.stat .k{font-size:.82rem;color:var(--ink3)}
.chart svg{display:block;width:100%;height:auto}
.ch-axis{stroke:var(--rule);stroke-width:1}
.ch-grid{stroke:var(--rule2);stroke-width:1}
.ch-txt{fill:var(--ink3);font:500 10px var(--text)}
.ch-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-line.b{stroke:var(--accent)}
.ch-dot{fill:var(--ink)}.ch-dot.b{fill:var(--accent)}
.ch-bar{fill:var(--ink)}
.ch-zone.g{fill:var(--green-bg)}.ch-zone.a{fill:var(--amber-bg)}.ch-zone.r{fill:var(--red-bg)}
.empty{padding:22px 10px;text-align:center;color:var(--ink3);font-size:.93rem}
.benchrow{display:grid;grid-template-columns:1fr 104px 64px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--rule2)}
.benchrow:first-child{border-top:0}
.benchrow .fld input{height:40px;font-size:1rem;padding-right:30px}

/* settings */
.setrow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rule2)}
.setrow2:first-child{border-top:0}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--rule);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .num{min-width:22px;text-align:center;font-size:1.2rem;font-weight:700}
.stepper .btn{white-space:nowrap;padding:0 10px}

/* figures */
svg.fig{display:block;width:100%;height:auto;overflow:visible}
.fg-body,.fg-far,.fg-glow,.fg-eq,.fg-eqd,.fg-pad,.fg-cable,.fg-cable2,.fg-band,.fg-ground,.fg-seam{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg-body{stroke:var(--fig)}.fg-far{stroke:var(--fig-far)}.fg-head{fill:var(--fig)}
.fg-glow{stroke:var(--glow);opacity:.5}.fg-glowd{fill:var(--glow);opacity:.5}
.fg-eq{stroke:var(--eq)}.fg-eqd{stroke:var(--eq-dark)}.fg-pad{stroke:var(--pad)}
.fg-cable{stroke:var(--eq)}.fg-cable2{stroke:var(--eq-dark)}.fg-band{stroke:var(--band)}
.fg-pulley{fill:var(--paper);stroke:var(--eq);stroke-width:1.6}
.fg-fill,.fg-fillsoft{fill:var(--eq-soft)}.fg-fillpad{fill:var(--pad)}
.fg-ring{fill:none;stroke:var(--eq-dark);stroke-width:3}.fg-plate{fill:var(--eq-dark)}.fg-hub{fill:var(--paper)}
.fg-ball{fill:var(--ball)}.fg-seam{stroke:#fff;stroke-width:1.2;opacity:.7}.fg-eqdot{fill:var(--eq-dark)}
.fg-ground{stroke:var(--rule);stroke-width:2}.fg-ghost{opacity:.2}
.fg-injury{fill:var(--red);opacity:.85}
.fg-injury-ring{fill:none;stroke:var(--red);stroke-width:1.6;opacity:.6}
@media (prefers-reduced-motion:no-preference){.fg-injury-ring{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}

/* --- reliability fixes --- */
.sheet-h h2:focus{outline:none}
.brand{min-width:0;overflow:hidden}
.sync{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){.sync{font-size:0;gap:0}.brand{font-size:1.15rem}}
button,input,textarea,select,summary,[role="button"],[data-ex],[data-plan]{touch-action:manipulation}
svg.fig{pointer-events:none}
.timer{pointer-events:none;gap:10px;padding:8px 10px 12px 14px}
.timer button{pointer-events:auto;min-height:36px;min-width:42px;padding:0 8px}
.timer .t{font-size:1.65rem;min-width:60px}
.timer .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.timer-on main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){body.timer-on main{padding-bottom:110px}}
.banner.calm{border-left:5px solid #8e9aa4}
</style>

<body>
<header class="top"><div class="top-in"></div></header>
<nav class="tabs" aria-label="Sections"></nav>
<main id="main" tabindex="-1"></main>
<div id="timer" class="timer" role="timer" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden></section>
<script>
/* ===== Figure engine: posable mannequin, IK, props, glow, animation ===== */
const FIG = (() => {
  const L = { torso: 50, neck: 7, head: 10.5, ua: 28, fa: 25, th: 43, sh: 41, ft: 13 };
  const HS = 14.5, HH = 9;
  const RAD = Math.PI / 180;
  const cs = a => Math.cos(a * RAD), sn = a => Math.sin(a * RAD);
  const add = (p, a, l) => [p[0] + cs(a) * l, p[1] + sn(a) * l];
  const angOf = (p, q) => Math.atan2(q[1] - p[1], q[0] - p[0]) / RAD;
  const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
  const lerp = (a, b, u) => a + (b - a) * u;
  const lerpA = (a, b, u) => a + ((((b - a) % 360) + 540) % 360 - 180) * u;
  const lerpP = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
  const quad = (p0, c, p1, u) => {
    const m = 1 - u;
    return [m * m * p0[0] + 2 * m * u * c[0] + u * u * p1[0], m * m * p0[1] + 2 * m * u * c[1] + u * u * p1[1]];
  };
  const quadTan = (p0, c, p1, u) => {
    const dx = 2 * (1 - u) * (c[0] - p0[0]) + 2 * u * (p1[0] - c[0]);
    const dy = 2 * (1 - u) * (c[1] - p0[1]) + 2 * u * (p1[1] - c[1]);
    return Math.atan2(dy, dx) / RAD;
  };
  const LIMBS = {
    a1: { root: 's1', j: 'e1', e: 'w1', la: L.ua, lb: L.fa, arm: true },
    a2: { root: 's2', j: 'e2', e: 'w2', la: L.ua, lb: L.fa, arm: true },
    l1: { root: 'hp1', j: 'k1', e: 'an1', la: L.th, lb: L.sh, arm: false },
    l2: { root: 'hp2', j: 'k2', e: 'an2', la: L.th, lb: L.sh, arm: false },
  };

  function ik(root, target, l1, l2, bend) {
    const d0 = dist(root, target), th = angOf(root, target);
    const max = l1 + l2 - 0.0005, min = Math.abs(l1 - l2) + 0.0005;
    const d = Math.min(max, Math.max(min, d0));
    const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const al = Math.acos(Math.max(-1, Math.min(1, c))) / RAD;
    const A = th + (bend >= 0 ? 1 : -1) * al;
    const j = add(root, A, l1);
    const e = add(root, th, d);
    return { A, B: angOf(j, e), j, e };
  }

  function rp(spec, J) {
    if (spec == null) return [0, 0];
    if (Array.isArray(spec)) return spec;
    if (typeof spec === 'string') return J[spec] || [0, 0];
    let base;
    if (spec.mid) { const a = rp(spec.mid[0], J), b = rp(spec.mid[1], J); base = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
    else base = rp(spec.j, J);
    let p = base.slice();
    if (spec.d) p = [p[0] + spec.d[0], p[1] + spec.d[1]];
    if (spec.o) for (const [a, l] of spec.o) p = add(p, a, l);
    if (spec.perp) { const a = rp(spec.perp[0], J), b = rp(spec.perp[1], J); p = add(p, angOf(a, b) + 90, spec.l || 0); }
    if (spec.along) { const a = rp(spec.along[0], J), b = rp(spec.along[1], J); p = add(p, angOf(a, b), spec.l || 0); }
    if (spec.to) { const q = rp(spec.to, J); p = add(p, angOf(p, q), spec.l || 0); }
    if (spec.floor) p = [p[0], spec.floor === true ? 0 : spec.floor];
    return p;
  }

  // Build joints from a canonical pose {view, hip, t, tb, h, a1:{A,B,sa,sb}, ..., l1:{A,B,sa,sb,ft}}
  function joints(C) {
    const v = C.view;
    const J = {};
    const tb = C.tb || 0;
    const hip = C.hip.slice();
    const chord = L.torso * (1 - 0.00016 * tb * tb);
    const sh = add(hip, C.t, chord);
    const mid = [(hip[0] + sh[0]) / 2, (hip[1] + sh[1]) / 2];
    const ctrl = add(mid, C.t + 90, tb);
    const tanS = angOf(ctrl, sh), tanH = angOf(hip, ctrl);
    J.hip = hip; J.sh = sh; J.ctrl = ctrl;
    const h = C.h == null ? tanS : C.h;
    J.head = add(sh, h, L.neck + L.head);
    J.neck = add(sh, h, L.neck * 0.6);
    if (v === 'front') {
      const hs = C.sw == null ? HS : C.sw, hh = C.hw == null ? HH : C.hw;
      J.s1 = add(sh, tanS + 90, hs); J.s2 = add(sh, tanS - 90, hs);
      J.hp1 = add(hip, tanH + 90, hh); J.hp2 = add(hip, tanH - 90, hh);
    } else {
      J.s1 = sh.slice(); J.s2 = sh.slice(); J.hp1 = hip.slice(); J.hp2 = hip.slice();
    }
    const cp = quad(hip, ctrl, sh, 0.72);
    J.chest = v === 'front' ? cp : add(cp, tanS - 90, 7);
    J.belly = v === 'front' ? quad(hip, ctrl, sh, 0.3) : add(quad(hip, ctrl, sh, 0.3), tanH - 90, 7);
    J.low = v === 'front' ? quad(hip, ctrl, sh, 0.25) : add(quad(hip, ctrl, sh, 0.25), tanH + 90, 7);
    for (const k of ['a1', 'a2', 'l1', 'l2']) {
      const S = LIMBS[k], c = C[k];
      const r = J[S.root];
      const j = add(r, c.A, S.la * c.sa);
      const e = add(j, c.B, S.lb * c.sb);
      J[S.j] = j; J[S.e] = e;
      if (S.arm) J[k === 'a1' ? 'h1' : 'h2'] = add(e, c.B, 4 * c.sb);
      else {
        const fl = v === 'front' ? 6.5 : L.ft;
        const ft = c.ft == null ? (v === 'front' ? (k === 'l1' ? c.B - 75 : c.B + 75) : c.B + 90) : c.ft;
        J[k === 'l1' ? 'toe1' : 'toe2'] = add(e, ft, fl);
        J[k === 'l1' ? 'heel1' : 'heel2'] = add(e, ft + 180, v === 'front' ? 0 : 2.5);
      }
    }
    J._tanS = tanS; J._tanH = tanH;
    return J;
  }

  function limbFromSpec(spec, view, key, tanS) {
    const out = { A: -90, B: -90, sa: 1, sb: 1, ft: null };
    if (!spec) return out;
    if (Array.isArray(spec)) { out.A = spec[0]; out.B = spec[1]; if (spec[2] != null) out.ft = spec[2]; return out; }
    if (spec.sc) { out.sa = spec.sc[0]; out.sb = spec.sc[1]; }
    if (spec.ft != null) out.ft = spec.ft;
    if (spec.r) { out.A = spec.r[0] + tanS; out.B = spec.r[1] + tanS; return out; }
    if (spec.a) { out.A = spec.a[0]; out.B = spec.a[1]; return out; }
    return out;
  }

  // Resolve an authored pose into canonical form (+ anchor/IK info for interpolation)
  function resolve(P, view) {
    const C = { view, hip: (P.hip || [0, 87]).slice(), t: P.t == null ? 90 : P.t, tb: P.tb || 0, h: P.h == null ? null : P.h, hw: P.hw, sw: P.sw };
    const dflt = view === 'front'
      ? { a1: [-97, -93], a2: [-83, -87], l1: [-94, -91], l2: [-86, -89] }
      : { a1: [-90, -90], a2: [-90, -90], l1: [-90, -90], l2: [-90, -90] };
    // provisional torso tangent for relative specs
    const tb = C.tb, chord = L.torso * (1 - 0.00016 * tb * tb);
    const sh = add(C.hip, C.t, chord);
    const mid = [(C.hip[0] + sh[0]) / 2, (C.hip[1] + sh[1]) / 2];
    const tanS = angOf(add(mid, C.t + 90, tb), sh);
    const ikInfo = {};
    for (const k of ['a1', 'a2', 'l1', 'l2']) {
      const spec = P[k] == null ? dflt[k] : P[k];
      C[k] = limbFromSpec(spec, view, k, tanS);
      if (spec && spec.ik) ikInfo[k] = { target: spec.ik, bend: spec.bend == null ? 1 : spec.bend, ft: spec.ft };
    }
    let J = joints(C);
    let rot = 0;
    const anch = P.anchor ? { j: P.anchor.j, at: P.anchor.at.slice() } : null;
    if (anch) {
      const A = J[anch.j];
      const dx = anch.at[0] - A[0], dy = anch.at[1] - A[1];
      C.hip = [C.hip[0] + dx, C.hip[1] + dy];
      J = joints(C);
      if (P.level) {
        const piv = anch.at, Q = J[P.level.j];
        const r = dist(piv, Q), cur = angOf(piv, Q);
        const s = (P.level.y - piv[1]) / r;
        if (Math.abs(s) <= 1) {
          const c1 = Math.asin(s) / RAD, c2 = 180 - c1;
          const df = a => Math.abs(((a - cur) % 360 + 540) % 360 - 180);
          rot = (df(c1) < df(c2) ? c1 : c2) - cur;
          // rotate canonical: hip about pivot, all angles += rot
          const hp = C.hip, rr = dist(piv, hp), ra = angOf(piv, hp) + rot;
          C.hip = add(piv, ra, rr);
          C.t += rot; if (C.h != null) C.h += rot;
          for (const k of ['a1', 'a2', 'l1', 'l2']) { C[k].A += rot; C[k].B += rot; if (C[k].ft != null) C[k].ft += rot; }
          J = joints(C);
        }
      }
    }
    // IK limbs: solve now in world coords, store resulting angles
    for (const k of Object.keys(ikInfo)) {
      const S = LIMBS[k], info = ikInfo[k], c = C[k];
      const tgt = rp(info.target, J);
      info.tgtPt = tgt.slice();
      const res = ik(J[S.root], tgt, S.la * c.sa, S.lb * c.sb, info.bend);
      c.A = res.A; c.B = res.B;
      if (info.ft != null) c.ft = info.ft;
      J = joints(C);
    }
    if (anch) anch.cur = J[anch.j].slice();
    return { C, anch, ikInfo };
  }

  function interp(R0, R1, u) {
    const a = R0.C, b = R1.C;
    const C = { view: a.view, hip: lerpP(a.hip, b.hip, u), t: lerpA(a.t, b.t, u), tb: lerp(a.tb, b.tb, u) };
    if (a.hw != null || b.hw != null) C.hw = lerp(a.hw == null ? HH : a.hw, b.hw == null ? HH : b.hw, u);
    if (a.sw != null || b.sw != null) C.sw = lerp(a.sw == null ? HS : a.sw, b.sw == null ? HS : b.sw, u);
    C.h = (a.h == null && b.h == null) ? null : lerpA(a.h == null ? a.t : a.h, b.h == null ? b.t : b.h, u);
    for (const k of ['a1', 'a2', 'l1', 'l2']) {
      const x = a[k], y = b[k];
      C[k] = { A: lerpA(x.A, y.A, u), B: lerpA(x.B, y.B, u), sa: lerp(x.sa, y.sa, u), sb: lerp(x.sb, y.sb, u) };
      if (x.ft != null || y.ft != null) {
        const fx = x.ft == null ? (a.view === 'front' ? null : x.B + 90) : x.ft;
        const fy = y.ft == null ? (a.view === 'front' ? null : y.B + 90) : y.ft;
        C[k].ft = (fx == null || fy == null) ? null : lerpA(fx, fy, u);
      } else C[k].ft = null;
    }
    let J = joints(C);
    if (R0.anch && R1.anch && R0.anch.j === R1.anch.j) {
      const want = lerpP(R0.anch.cur, R1.anch.cur, u), have = J[R0.anch.j];
      C.hip = [C.hip[0] + want[0] - have[0], C.hip[1] + want[1] - have[1]];
      J = joints(C);
    }
    for (const k of ['a1', 'a2', 'l1', 'l2']) {
      const i0 = R0.ikInfo[k], i1 = R1.ikInfo[k];
      if (i0 && i1) {
        const S = LIMBS[k], c = C[k];
        const res = ik(J[S.root], lerpP(i0.tgtPt, i1.tgtPt, u), S.la * c.sa, S.lb * c.sb, i0.bend);
        c.A = res.A; c.B = res.B;
        J = joints(C);
      }
    }
    return J;
  }

  /* ---------- shape building ---------- */
  const LW = 8.2, TW_SIDE = 13.5, TW_FRONT = 19;
  function pathQuad(p0, c, p1) { return `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)}Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`; }
  function pathLine(pts) { return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L'); }
  function curveSeg(J, u0, u1, off) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const u = u0 + (u1 - u0) * i / 8;
      const p = quad(J.hip, J.ctrl, J.sh, u), tg = quadTan(J.hip, J.ctrl, J.sh, u);
      pts.push(add(p, tg + 90, off));
    }
    return pathLine(pts);
  }
  function segOff(a, b, off) { const an = angOf(a, b); return pathLine([add(a, an + 90, off), add(b, an + 90, off)]); }

  function glowShapes(spec, J) {
    const v = spec.view, out = [];
    const G = (d, w) => out.push({ t: 'path', a: { d, 'stroke-width': w || (v === 'front' ? 10 : 10.5) }, c: 'fg-glow' });
    const C = (p, r) => out.push({ t: 'circle', a: { cx: p[0], cy: p[1], r: r || 6.5 }, c: 'fg-glowd' });
    for (const g of spec.hl || []) {
      if (g === 'abs') v === 'front' ? G(curveSeg(J, 0.1, 0.6, 0), 12) : G(curveSeg(J, 0.08, 0.62, -4.5));
      else if (g === 'erectors') v === 'front' ? G(curveSeg(J, 0.05, 0.7, 0), 12) : G(curveSeg(J, 0.04, 0.72, 4.5));
      else if (g === 'chest') { if (v === 'front') { G(curveSeg(J, 0.62, 0.93, 6.5), 9); G(curveSeg(J, 0.62, 0.93, -6.5), 9); } else G(curveSeg(J, 0.6, 0.95, -5)); }
      else if (g === 'lats') { if (v === 'front') { G(curveSeg(J, 0.42, 0.88, 10), 8); G(curveSeg(J, 0.42, 0.88, -10), 8); } else G(curveSeg(J, 0.42, 0.9, 4.5)); }
      else if (g === 'upperback') v === 'front' ? G(curveSeg(J, 0.7, 0.98, 0), 14) : G(curveSeg(J, 0.7, 0.99, 4.5));
      else if (g === 'obl1') G(curveSeg(J, 0.08, 0.6, v === 'front' ? 8.5 : 0), 8);
      else if (g === 'obl2') G(curveSeg(J, 0.08, 0.6, v === 'front' ? -8.5 : 0), 8);
      else if (g === 'core') { G(curveSeg(J, 0.08, 0.6, 7.5), 8); G(curveSeg(J, 0.08, 0.6, -7.5), 8); }
      else if (g === 'glutes') { if (v === 'front') { C(J.hp1); C(J.hp2); } else C(add(J.hip, angOf(J.hip, J.ctrl) + 90, 5.5), 7.5); }
      else if (g === 'glute2') C(J.hp2, 7.5);
      else if (g === 'quads1') G(segOff(J.hp1, J.k1, 3));
      else if (g === 'quads2') G(segOff(J.hp2, J.k2, 3));
      else if (g === 'quads') { G(segOff(J.hp1, J.k1, 3)); if (v === 'front') G(segOff(J.hp2, J.k2, -3)); }
      else if (g === 'hams1') G(segOff(J.hp1, J.k1, -3));
      else if (g === 'calves1') G(segOff(J.k1, J.an1, -3));
      else if (g === 'adductors') { G(segOff(J.hp1, J.k1, -3.2), 7); G(segOff(J.hp2, J.k2, 3.2), 7); }
      else if (g === 'adductor2') G(segOff(J.hp2, J.k2, 3), 7);
      else if (g === 'abductors') { C(add(J.hp1, angOf(J.hp2, J.hp1), 5)); C(add(J.hp2, angOf(J.hp1, J.hp2), 5)); }
      else if (g === 'delts') { C(J.s1, 6.8); if (v === 'front') C(J.s2, 6.8); }
      else if (g === 'delts1') C(J.s1, 6.8);

  /* plan */

  function vStrengthPlan() {

  function vPhase(id) {

    if (R.length > 1) h += `<div class="sec"><h3 style="margin-bottom:8px">When it runs</h3><div class="ranges">${R.map(r => `<button class="chip" data-go="${r.from}">Cycle ${r.cycle}: ${esc(fmtShort(r.from))} to ${esc(fmtYear(r.to))}</button>`).join('')}</div></div>`;

      }).join('') + '</div></div>';

  function sessionDetails(T, pid) {
    const rows = T.items.map(it => {
      let prog = '';
      if (it.p) prog = `<div class="tiny" style="margin-top:3px">${Object.keys(it.p).map(w => `Week ${w}: ${esc(it.p[w].rx || '')}${it.p[w].x && it.p[w].x !== it.x ? ` (${esc(EX[it.p[w].x].n)})` : ''}`).join('<br>')}</div>`;

  function plateBar(R, t) {
    const first = R[0].from, last = R[R.length - 1].to, total = diffDays(last, first) + 1;
    const W = 560, M = 14, H = 176, cy = 80;
    const hk = { 2.5: 32, 5: 46, 10: 64, 15: 82, 20: 100, 25: 118 };
    const scale = W / total;
    let x = M, svg = `<svg viewBox="0 0 ${W + 2 * M} ${H}" role="img" aria-label="Two-year plan drawn as plates on a barbell sleeve. Heavier plates mean heavier training.">`;
    svg += `<rect x="0" y="${cy - 4}" width="${W + 2 * M}" height="8" rx="4" fill="var(--eq-soft)"/><rect x="3" y="${cy - 13}" width="7" height="26" rx="3" fill="var(--eq)"/>`;
    R.forEach(r => {
      const P = PHASES[r.phase], pl = PLATES[P.plate], w = (diffDays(r.to, r.from) + 1) * scale - 1.6, hh = hk[pl.kg];
      svg += `<g data-plan="${r.phase}" style="cursor:pointer"><title>${esc(P.name)}${r.cycle ? ', cycle ' + r.cycle : ''}: ${esc(fmtShort(r.from))} to ${esc(fmtYear(r.to))}</title><rect x="${x.toFixed(1)}" y="${(cy - hh / 2).toFixed(1)}" width="${Math.max(2.5, w).toFixed(1)}" height="${hh}" rx="${Math.min(3, w / 2).toFixed(1)}" fill="${pl.c}" stroke="${pl.edge || 'rgba(0,0,0,.2)'}" stroke-width="1"/></g>`;
      x += w + 1.6;
    });
    if (t >= first && t <= last) {
      const tx = M + diffDays(t, first) * scale;
      svg += `<path d="M${tx.toFixed(1)} 8V${H - 34}" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="3 3"/><text x="${(tx + 4).toFixed(1)}" y="16" class="ch-txt" style="font-size:15px;font-weight:700;fill:var(--ink)">Today</text>`;
    }
    ['2027-01-01', '2028-01-01'].forEach(y => { const yx = M + diffDays(y, first) * scale; svg += `<path d="M${yx.toFixed(1)} ${H - 30}v8" stroke="var(--ink3)" stroke-width="1.4"/><text x="${yx.toFixed(1)}" y="${H - 6}" text-anchor="middle" class="ch-txt" style="font-size:15px">${y.slice(0, 4)}</text>`; });
    svg += `<text x="${W + M}" y="${H - 6}" text-anchor="end" class="ch-txt" style="font-size:15px">Sep 2028</text></svg>`;
    return svg;
  }

  /* ---------- rest timer ---------- */

    stop() { clearInterval(this.iv); this.iv = null; $('#timer').hidden = true; document.body.classList.remove('timer-on'); },
    tick() {

        }

    },

    touchProf(); render(false); openSettings();
  });
  document.addEventListener('focusout', () => { setTimeout(() => { if (pendingSoft && !S.sheet) { const a = document.activeElement; if (!a || !(a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) { pendingSoft = false; render(true); } } }, 50); });
  $('#scrim').addEventListener('click', () => { closeSheet(); if (pendingSoft) { pendingSoft = false; render(true); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'today') { const t = todayStr(); if (S.lastSeenDay && S.lastSeenDay !== t && S.date === S.lastSeenDay) { S.date = t; render(false); } S.lastSeenDay = t; } });

  async function exportCSV() {
    const rows = [['date', 'phase', 'session', 'exercise', 'set', 'value_1', 'value_2', 'done', 'pain_before', 'pain_after', 'numbness', 'session_complete']];
    Object.keys(S.days).sort().forEach(date => {
      const r = S.days[date], pd = pday(date), T = pd.before ? null : D[pd.dayId];
      const sets = r.sets || {};
      const keys = Object.keys(sets);
      if (!keys.length) rows.push([date, pd.phase || '', T ? T.t : '', '', '', '', '', '', r.pb ?? '', r.pa ?? '', r.nb ?? '', r.done ? 'yes' : '']);
      keys.forEach(k => (sets[k] || []).forEach((s, j) => { if (s) rows.push([date, pd.phase || '', T ? T.t : '', EX[k.split(':')[1]] ? EX[k.split(':')[1]].n : k, j + 1, s[0] || '', s[1] || '', s[2] ? 'yes' : '', r.pb ?? '', r.pa ?? '', r.nb ?? '', r.done ? 'yes' : '']); }));
    });
    const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\n');
    try { await Cloud.dl.save({ filename: `rebuild-build-log-${todayStr()}.csv`, data: csv }); } catch (e) { /* declined or unavailable */ }
  }

  /* ---------- boot ---------- */
  function boot() {
    loadLocal(); S.modes.back = normalizeMode('back', S.modes.back); activateMode(S.mode); saveLocal(); applyTheme();
    S.lastSeenDay = todayStr();
    $('.top-in').innerHTML = `<div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#d7263d"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/><circle cx="12" cy="12" r="2.4" fill="var(--bg)"/></svg>Rebuild &amp; Build</div><div class="sync" id="sync" role="status"></div><button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button>`;
    $('.tabs').innerHTML = [['today', 'Today', I.today], ['plan', 'Plan', I.plan], ['care', 'Back care', I.care], ['lib', 'Exercises', I.lib], ['prog', 'Progress', I.prog]].map(([k, l, ic]) => `<button type="button" data-tab="${k}">${ic}<span>${l}</span></button>`).join('');
    setStatus('local');
    FIG.setEnabled(S.profile.anim);
    render(false);
    Cloud.init();
  }
  boot();
})();

</script>
</body>
